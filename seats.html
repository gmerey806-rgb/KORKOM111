<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Орын таңдау — KINOPARK 7</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --dark: #07101f;
            --dark-2: #101c31;

            --white: #ffffff;
            --text: #172554;
            --muted: #64748b;
            --line: #e2e8f0;

            --red: #ef4444;
            --red-dark: #b91c1c;
            --dark-seat: #111827;

            --blue: #2563eb;
            --purple: #7c3aed;

            --button:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed,
                    #ec4899
                );

            --warm:
                linear-gradient(
                    135deg,
                    #ffe45e,
                    #ff8a3d,
                    #ff3d71
                );
        }

        body {
            min-height: 100vh;

            color: var(--text);
            font-family: Arial, Inter, sans-serif;

            background:
                radial-gradient(
                    circle at 5% 0%,
                    rgba(37, 99, 235, 0.3),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 95% 15%,
                    rgba(239, 68, 68, 0.24),
                    transparent 30%
                ),
                #f4f6fa;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ================= HEADER ================= */

        header {
            width: 100%;
            padding: 14px 0;

            background: #07101f;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.18);
        }

        .top-nav {
            width: min(1200px, calc(100% - 32px));
            min-height: 64px;

            margin: auto;
            padding: 10px 16px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;

            background: var(--dark-2);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            color: #ffffff;

            font-size: 20px;
            font-weight: 900;
            white-space: nowrap;
        }

        .logo span {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            border-radius: 10px;

            color: #25152d;
            background: var(--warm);
        }

        .menu {
            display: flex;
            justify-content: flex-end;
            gap: 4px;
            flex-wrap: wrap;
        }

        .menu a {
            padding: 9px 11px;

            border-radius: 8px;

            color: #cbd5e1;

            font-size: 12px;
            font-weight: 700;

            transition: 0.2s;
        }

        .menu a:hover,
        .menu a.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
        }

        /* ================= MAIN ================= */

        .page {
            width: min(1100px, calc(100% - 32px));

            margin: auto;
            padding: 40px 0 90px;
        }

        /* ================= MOVIE INFO ================= */

        .movie-card {
            position: relative;

            display: flex;
            align-items: center;
            gap: 22px;

            padding: 20px;

            border: 1px solid var(--line);
            border-radius: 18px;

            background: #ffffff;

            box-shadow:
                0 14px 40px rgba(15, 23, 42, 0.1);
        }

        .movie-poster {
            width: 120px;
            height: 160px;

            flex-shrink: 0;

            overflow: hidden;

            border-radius: 12px;
            background: #dbeafe;
        }

        .movie-poster img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }

        .movie-info {
            padding-right: 170px;
        }

        .overline {
            margin-bottom: 8px;

            color: #dc2626;

            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1.2px;
        }

        .movie-info h1 {
            margin-bottom: 8px;

            color: var(--text);

            font-family: Georgia, serif;
            font-size: clamp(30px, 5vw, 48px);
            line-height: 1.05;
        }

        .movie-meta {
            color: #475569;

            font-size: 14px;
            font-weight: 700;
        }

        .movie-description {
            max-width: 600px;

            margin-top: 11px;

            color: var(--muted);

            font-size: 13px;
            line-height: 1.5;
        }

        .movie-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;

            margin-top: 14px;
        }

        .movie-tags span {
            padding: 6px 9px;

            border-radius: 6px;

            color: #334155;
            background: #f1f5f9;

            font-size: 11px;
            font-weight: 800;
        }

        .movie-tags span.age {
            color: #991b1b;
            background: #fee2e2;
        }

        .change-movie {
            position: absolute;
            top: 20px;
            right: 20px;

            padding: 9px 12px;

            border-radius: 8px;

            color: #1d4ed8;
            background: #eff6ff;

            font-size: 12px;
            font-weight: 800;
        }

        .change-movie:hover {
            background: #dbeafe;
        }

        /* ================= SEAT BOX ================= */

        .seat-box {
            margin-top: 24px;
            padding: 28px;

            border: 1px solid var(--line);
            border-radius: 18px;

            background: #ffffff;

            box-shadow:
                0 14px 40px rgba(15, 23, 42, 0.1);
        }

        .seat-heading {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
        }

        .seat-heading h2 {
            color: var(--text);
            font-size: 27px;
        }

        .seat-heading p {
            margin-top: 6px;

            color: var(--muted);
            font-size: 13px;
        }

        .hall-select {
            padding: 10px 12px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;

            color: var(--text);
            background: #ffffff;

            font-size: 12px;
            font-weight: 800;
        }

        /* ================= LEGEND ================= */

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;

            margin-top: 24px;
            padding: 14px 0;

            border-top: 1px solid #f1f5f9;
            border-bottom: 1px solid #f1f5f9;

            color: #475569;
            font-size: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .legend-box {
            width: 18px;
            height: 18px;

            display: inline-block;

            border: 1px solid;
            border-radius: 4px;
        }

        .legend-free {
            border-color: #cbd5e1;
            background: #ffffff;
        }

        .legend-occupied {
            border-color: #111827;
            background: #111827;
        }

        .legend-selected {
            border-color: #dc2626;
            background: #ef4444;
        }

        /* ================= SCREEN ================= */

        .screen-area {
            width: min(650px, 92%);

            margin: 30px auto 25px;

            text-align: center;
        }

        .screen {
            height: 38px;

            display: grid;
            place-items: center;

            border-radius: 50% 50% 8px 8px;

            color: #1e3a8a;
            background:
                linear-gradient(
                    180deg,
                    #dbeafe,
                    #93c5fd
                );

            box-shadow:
                0 5px 15px rgba(37, 99, 235, 0.23);

            font-size: 11px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .screen-area p {
            margin-top: 8px;

            color: #94a3b8;
            font-size: 11px;
        }

        /* ================= HALL ================= */

        .hall {
            width: min(720px, 100%);

            margin: auto;
            padding: 28px 18px;

            border-radius: 14px;

            background: #f8fafc;

            box-shadow:
                inset 0 0 28px rgba(15, 23, 42, 0.06);
        }

        .seats {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px 13px;
        }

        .seat {
            position: relative;

            width: 100%;
            aspect-ratio: 1.15;

            border: 1px solid #cbd5e1;
            border-radius: 6px;

            color: #334155;
            background: #ffffff;

            cursor: pointer;

            font-size: 12px;
            font-weight: 800;

            transition: 0.18s;
        }

        .seat:hover:not(:disabled) {
            border-color: #f87171;
            background: #fee2e2;

            transform: translateY(-3px);
        }

        .seat.selected {
            border-color: var(--red-dark);

            color: #ffffff;
            background: var(--red);

            box-shadow:
                0 5px 14px rgba(239, 68, 68, 0.3);
        }

        .seat:disabled {
            border-color: #111827;

            color: #64748b;
            background: #111827;

            cursor: not-allowed;
        }

        .seat:disabled::after {
            content: "×";

            position: absolute;
            inset: 0;

            display: grid;
            place-items: center;

            color: #ffffff;
            font-size: 21px;
        }

        .seat:disabled {
            font-size: 0;
        }

        /* ================= BOTTOM PANEL ================= */

        .bottom-panel {
            position: sticky;
            bottom: 15px;
            z-index: 5;

            width: min(1100px, calc(100% - 32px));

            margin: 20px auto 0;
            padding: 16px 18px;

            display: flex;
            align-items: center;
            gap: 22px;

            border: 1px solid #dbe3ef;
            border-radius: 14px;

            background: rgba(255, 255, 255, 0.96);

            box-shadow:
                0 15px 40px rgba(15, 23, 42, 0.18);

            backdrop-filter: blur(15px);
        }

        .selected-info {
            flex: 1;
            min-width: 0;
        }

        .selected-label,
        .price-label {
            display: block;

            margin-bottom: 5px;

            color: #64748b;
            font-size: 11px;
            font-weight: 700;
        }

        #selectedSeat {
            display: block;

            overflow: hidden;

            color: var(--text);

            font-size: 14px;
            font-weight: 900;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .price {
            min-width: 130px;
        }

        #totalPrice {
            display: block;

            color: #b45309;

            font-size: 19px;
            font-weight: 900;
        }

        .ticket-button {
            min-width: 190px;

            padding: 14px 18px;

            border: 0;
            border-radius: 9px;

            color: #ffffff;
            background: var(--button);

            cursor: pointer;

            font-size: 13px;
            font-weight: 900;

            transition: 0.2s;
        }

        .ticket-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .ticket-button:not(:disabled):hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 22px rgba(37, 99, 235, 0.25);
        }

        /* ================= MESSAGE ================= */

        .message {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 20;

            max-width: 300px;

            padding: 13px 16px;

            border-radius: 8px;

            color: #ffffff;
            background: #111827;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);

            font-size: 13px;

            opacity: 0;
            pointer-events: none;

            transform: translateY(15px);
            transition: 0.25s;
        }

        .message.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 760px) {
            .top-nav {
                flex-direction: column;
                padding: 12px 0;
            }

            .menu {
                justify-content: center;
            }

            .movie-card {
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .movie-info {
                padding-right: 0;
                flex: 1;
            }

            .change-movie {
                position: static;

                width: 100%;

                margin-top: 4px;

                text-align: center;
            }

            .bottom-panel {
                align-items: stretch;
                flex-wrap: wrap;
            }

            .selected-info {
                flex-basis: 55%;
            }

            .price {
                flex: 1;
            }

            .ticket-button {
                width: 100%;
                flex-basis: 100%;
            }
        }

        @media (max-width: 520px) {
            .page {
                width: calc(100% - 20px);
                padding-top: 24px;
            }

            .movie-card,
            .seat-box {
                padding: 18px 14px;
            }

            .movie-poster {
                width: 88px;
                height: 120px;
            }

            .movie-info h1 {
                font-size: 28px;
            }

            .movie-meta {
                font-size: 11px;
            }

            .movie-description {
                font-size: 11px;
            }

            .seat-heading {
                flex-direction: column;
            }

            .hall-select {
                width: 100%;
            }

            .legend {
                gap: 11px;
                font-size: 11px;
            }

            .hall {
                padding: 20px 6px;
            }

            .seats {
                gap: 7px 5px;
            }

            .seat {
                font-size: 10px;
            }

            .bottom-panel {
                width: calc(100% - 20px);
                padding: 14px;
            }

            .selected-info {
                flex-basis: 100%;
            }

            #selectedSeat {
                white-space: normal;
            }

            .message {
                right: 10px;
                bottom: 10px;
                left: 10px;

                max-width: none;

                text-align: center;
            }
        }
    </style>
</head>

                age: "16+",
                description:
                    "Ұшақ мұхитқа құлағаннан кейін аман қалған жолаушылар үшін күрес басталады.",
                image:
                    "https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/f957372c-606d-58eb-90c7-396cb894dcf7/81eb7c7a-0273-5988-a69b-29444c4f41c4.jpg"
            },

            8: {
                title: "Надежда",
                genre: "Фантастика • Экшен • Триллер",
                duration: "2 сағ 10 мин",
                age: "18+",
                description:
                    "Тыныш қаладағы жұмбақ оқиғалар ғаламдық қауіпке айналады.",
                image:
                    "https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/b9e8bc79-207d-5276-ac61-8da95d3f336e/8be74fa1-79a9-536b-b2b1-1e7a848b64b0.jpg"
            },

            9: {
                title: "Фамилия",
                genre: "Драма • Криминал",
                duration: "1 сағ 50 мин",
                age: "16+",
                description:
                    "Отбасының аты мен жеке арманның арасында қалған жас жігіттің оқиғасы.",
                image:
                    "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=900&q=90"
            },

            10: {
                title: "Бүркітші",
                genre: "Драма • Қазақстан",
                duration: "1 сағ 35 мин",
                age: "16+",
                description:
                    "Бүркітші мен оның қыраны туралы дала рухын баяндайтын әсерлі хикая.",
                image:
                    "https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/72f0e14c-c19f-56e1-85c0-87f309104270/0af98422-8d5d-5204-9f00-361f34eddb23.jpg"
            }
        };

        let adminFilm = null;

        try {
            const savedMovies =
                JSON.parse(
                    localStorage.getItem(
                        "adminMovies"
                    )
                ) || [];

            const savedMovie =
                savedMovies.find(
                    (movie) =>
                        `admin-${movie.id}` ===
                        movieId
                );

            if (savedMovie) {
                adminFilm = {
                    id: movieId,
                    title: savedMovie.title,
                    genre: savedMovie.genre,
                    duration: savedMovie.duration,
                    age: savedMovie.age,
                    description:
                        savedMovie.description ||
                        "Фильм туралы ақпарат.",
                    image: savedMovie.poster
                };
            }
        } catch (error) {
            adminFilm = null;
        }

        const film =
            films[movieId] ||
            adminFilm ||
            films[1];

        if (film.id === 5) {
            film.image =
                "https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=900&q=90";
        }

        const selectedSeats = [];

        const occupiedSeats = new Set([
            "1-3",
            "1-4",
            "2-2",
            "2-7",
            "3-3",
            "3-4",
            "4-6",
            "5-1",
            "5-2",
            "6-5"
        ]);

        function showPoster() {
            if (film.customPoster) {
                moviePoster.style.display = "none";

                const customPoster =
                    document.createElement("div");

                customPoster.className =
                    "custom-poster family-poster";

                customPoster.innerHTML = `
                    <div class="poster-symbol">
                        ♠
                    </div>

                    <strong>
                        ФАМИЛИЯ
                    </strong>

                    <span>
                        ДРАМА • КРИМИНАЛ
                    </span>

                    <small>
                        Отбасы. Абырой. Таңдау.
                    </small>
                `;

                moviePoster.parentElement.appendChild(
                    customPoster
                );

                return;
            }

            moviePoster.src =
                film.image;

            moviePoster.alt =
                `${film.title} фильмінің постері`;
        }

        movieTitle.textContent =
            film.title;

        movieMeta.textContent =
            film.genre;

        movieDescription.textContent =
            film.description;

        movieDuration.textContent =
            film.duration;

        movieAge.textContent =
            film.age;

        movieDate.textContent =
            selectedDay;

        movieTime.textContent =
            selectedTime;

        movieHallLabel.textContent =
            selectedHall.toUpperCase();

        hallSelect.value =
            selectedHall;

        function makeSeats() {
            seatsContainer.innerHTML = "";

            for (
                let row = 1;
                row <= rows;
                row += 1
            ) {
                for (
                    let number = 1;
                    number <= seatsInRow;
                    number += 1
                ) {
                    const seatId =
                        `${row}-${number}`;

                    const seat =
                        document.createElement(
                            "button"
                        );

                    seat.type = "button";
                    seat.className = "seat";
                    seat.textContent = number;
                    seat.dataset.seat = seatId;

                    seat.title =
                        `${row}-қатар, ${number}-орын`;

                    if (
                        occupiedSeats.has(
                            seatId
                        )
                    ) {
                        seat.disabled = true;

                        seat.title =
                            "Бұл орын бос емес";
                    } else {
                        seat.addEventListener(
                            "click",
                            () => {
                                chooseSeat(
                                    seat,
                                    seatId
                                );
                            }
                        );
                    }

                    seatsContainer.appendChild(
                        seat
                    );
                }
            }
        }

        function chooseSeat(
            seat,
            seatId
        ) {
            const index =
                selectedSeats.indexOf(
                    seatId
                );

            if (index === -1) {
                selectedSeats.push(
                    seatId
                );

                seat.classList.add(
                    "selected"
                );
            } else {
                selectedSeats.splice(
                    index,
                    1
                );

                seat.classList.remove(
                    "selected"
                );
            }

            updateOrder();
        }

        function updateOrder() {
            if (
                selectedSeats.length === 0
            ) {
                selectedSeatText.textContent =
                    "Орын таңдалмады";

                totalPriceText.textContent =
                    "0 ₸";

                ticketButton.disabled =
                    true;

                return;
            }

            selectedSeatText.textContent =
                selectedSeats.join(", ");

            totalPriceText.textContent =
                `${selectedSeats.length * ticketPrice} ₸`;

            ticketButton.disabled =
                false;
        }

        function showMessage(text) {
            message.textContent =
                text;

            message.classList.add(
                "show"
            );

            clearTimeout(
                showMessage.timer
            );

            showMessage.timer =
                setTimeout(
                    () => {
                        message.classList.remove(
                            "show"
                        );
                    },
                    2200
                );
        }

        hallSelect.addEventListener(
            "change",
            () => {
                movieHallLabel.textContent =
                    hallSelect.value.toUpperCase();

                showMessage(
                    `${hallSelect.value} таңдалды`
                );
            }
        );

        ticketButton.addEventListener(
            "click",
            () => {
                if (
                    selectedSeats.length === 0
                ) {
                    showMessage(
                        "Алдымен орын таңдаңыз"
                    );

                    return;
                }

                const ticketData =
                    new URLSearchParams({
                        movie: String(movieId),
                        day: selectedDay,
                        time: selectedTime,
                        hall: hallSelect.value,
                        seats:
                            selectedSeats.join(
                                ","
                            ),
                        total: String(
                            selectedSeats.length *
                            ticketPrice
                        )
                    });

                window.location.href =
                    `ticket.html?${ticketData.toString()}`;
            }
        );

        showPoster();
        makeSeats();
        updateOrder();
    </script>

</body>
</html>
